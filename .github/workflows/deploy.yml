name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build integrated app and all three independent apps
        run: pnpm run build:client
        env:
          GITHUB_PAGES: "true"

      - name: Verify independent entries and deep-link fallbacks
        run: |
          test -f dist/public/index.html
          test -f dist/public/404.html
          for app in systems-of-equations matrices vector; do
            test -f "dist/public/apps/$app/index.html"
            test -f "dist/public/apps/$app/404.html"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
